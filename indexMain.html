<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <title>Style Racers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>S • T • Y • L • E   ★    R • A • C • E • R • S</h1>

  <div class="burger" id="burger" onclick="toggleMenu()">
    ☰
  </div>

  <div class="cart"><i class="fas fa-shopping-cart"></i> Cart (0)</div>
</header>

<div class="topnav">
  <input type="text" placeholder="Search..">
</div>

<nav id="menu">
  <a href="#" class="nav-icon">
  <i class="fas fa-house"></i>domov</a>
  <a href="#" class="nav-icon">
    <i class="fas fa-newspaper"></i> novinky
  </a>
  <a href="#" class="nav-icon">
    <i class="fas fa-tags"></i> kupóny
  </a>
  <a href="#" class="nav-icon">
    <i class="fas fa-star"></i> recenze
  </a>
  <a href="#" class="nav-icon">
    <i class="fas fa-info-circle"></i> o nás
  </a>
  <a href="#" class="nav-icon">
    <i class="fas fa-phone"></i> kontakty
  </a>
</nav>

<div class="filter-menu">
  <h3>Kategorie</h3>
  <ul>
    <li><button onclick="filterProduct('vse')">Vše</button></li>
    <li><button onclick="filterProduct('elektronika')">Elektronika</button></li>
    <li><button onclick="filterProduct('obleceni')">Oblečení</button></li>
  </ul>

  <h3>Cena</h3>
  <input type="range" id="priceRange" min="0" max="100000" oninput="updatePrice(this.value)">
  <p>Do: <span id="priceValue">100000</span> Kč</p>
</div>

  <section class="products">

    <div class="product">
      <img src="https://via.placeholder.com/200" alt="Product">
      <h3>Product 1</h3>
      <p>$19.99</p>
      <button>Add to Cart</button>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/200" alt="Product">
      <h3>Product 2</h3>
      <p>$29.99</p>
      <button>Add to Cart</button>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/200" alt="Product">
      <h3>Product 3</h3>
      <p>$39.99</p>
      <button>Add to Cart</button>
    </div>

  </section>

  <footer>
    <p>© 2026 StyleRacers. All rights reserved.</p>
  </footer>

<script src="script.js"></script>
</body>
</html>

</body>
</html>
