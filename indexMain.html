<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <title>Style Racers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>S • T • Y • L • E   ★    R • A • C • E • R • S</h1>

  <div class="header-controls">
    <a href="cart.html" class="cart-button" id="cart-status">
      <i class="fas fa-shopping-cart"></i>
      <span class="cart-text">Košík</span>
      <span class="cart-count">0</span>
    </a></div>

  <div class="burger" id="burger" onclick="toggleMenu()">
    ☰
  </div>

</header>

<div class="topnav">
  <input type="text" placeholder="Search..">
</div>

<nav id="menu">
  <a href="indexMain.html" class="button">
  <i class="fas fa-house"></i>domov</a>
  <a href="#" class="nav-icon">
    <i class="fas fa-newspaper"></i> novinky
  </a>
  <a href="#" class="nav-icon">
    <i class="fas fa-tags"></i> kupóny
  </a>
  <a href="#" class="nav-icon">
    <i class="fas fa-star"></i> recenze
  </a>
  <a href="indexAboutUs.html" class="btn">
    <i class="fas fa-info-circle"></i> o nás
  </a>
  <a href="#" class="nav-icon">
    <i class="fas fa-phone"></i> kontakty
  </a>
</nav>

<div class="filter-menu">
  <h3>Kategorie</h3>
  <ul>
    <li><button onclick="filterProduct('vse')">Vše</button></li>
    <li><button onclick="filterProduct('elektronika')">volanty</button></li>
    <li><button onclick="filterProduct('obleceni')">sedačky</button></li>
  </ul>

  <h3>Cena</h3>
  <input type="range" id="priceRange" min="0" max="100000" oninput="updatePrice(this.value)">
  <p>Do: <span id="priceValue">100000</span> Kč</p>
</div>

  <section class="products">

    <div class="product">
      <a href="product1.html" data-id="1" data-name="Sparco R345 Volant" data-price="5226">
      <img src="Product-images/3-ramenny-volant-sparco-r345-350mm-semis-63mm.jpg" alt="Product">
      <h3>3 ramenný volant Sparco R345, 350mm semiš, 63mm</h3>
      <p>$5 226 Kč</p>
      <button class="add-to-cart">Do košíku</button>
      </a>
    </div>

    <div class="product">
      <a href="product2.html" data-id="2" data-name="Product 2" data-price="29.99">
      <img src="https://via.placeholder.com/200" alt="Product">
      <h3>Product 2</h3>
      <p>$29.99</p>
      <button class="add-to-cart">Do košíku</button>
      </a>
    </div>

    <div class="product">
      <a href="product3.html" data-id="3" data-name="Řadicí páka MOMO ULTRA černá" data-price="2924 ">
      <img src="Product-images/radici-paka-momo-ultra-cerna.jpg" alt="Product">
      <h3>Řadicí páka MOMO ULTRA černá</h3>
      <p>2 924 Kč</p>
      <button class="add-to-cart">Do košíku</button>
      </a>
    </div>

  </section>

  <footer>
    <p>© 2026 StyleRacers. All rights reserved.</p>
  </footer>

<script src="script.js"></script>
</body>
</html>
